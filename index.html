-top:8px;touch-action:none}.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,44px);gap:3px}.pad button{background:#416a65;border:2px solid #c8b489;color:white;border-radius:8px;font-size:20px;touch-action:none}.pad [data-dir=up]{grid-area:1/2}.pad [data-dir=down]{grid-area:3/2}.pad [data-dir=left]{grid-area:2/1}.pad [data-dir=right]{grid-area:2/3}.actions{display:grid;gap:8px;align-content:center}.actions button{min-height:58px}.below{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:6px}.shade{display:none;position:fixed;inset:0;background:#08171bc9;place-items:center;padding:14px;z-index:10}.shade.show{display:grid}.modal{width:min(100%,560px);max-height:90dvh;overflow:auto}.modalHead{display:flex;justify-content:space-between;align-items:center;gap:8px}.options{display:grid;gap:9px;margin-top:16px}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:15px 0}.slot{padding:9px 4px;text-align:center;background:#365057;border:1px solid #819d91;border-radius:8px;font-size:11px;min-height:66px}.slot.module{background:#5b4839}.health{background:#3c4440;height:12px;border-radius:6px;overflow:hidden}.health div{height:100%;background:#5cc281}.battleNames{display:grid;grid-template-columns:1fr 1fr;gap:15px}.battleScene{background:linear-gradient(#81adb1 70%,#82a46c 70%);height:138px;display:flex;justify-content:space-around;align-items:center;font-size:45px;border-radius:8px;margin:15px 0;color:#17302c}@media(max-width:680px){body{display:block}.app{padding:5px}.panel{padding:13px}.mobile{display:flex}.below .muted{display:none}.portrait{width:88px;height:112px}.character{padding:8px}.hud{font-size:13px}.btn{padding:9px 12px}}

/* Mobile game input: prevent long-press selection, overscroll and accidental zoom. */
html,body{width:100%;min-height:100%;overflow-x:hidden;overscroll-behavior:none}
body{touch-action:pan-y}
button,.btn,.character,.pad,.actions,#world,#dialog{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;appearance:none;-webkit-appearance:none;outline-offset:2px}
button:focus:not(:focus-visible){outline:none}
button:focus-visible{outline:2px solid #f2cc79}
button:active,.pad button.pressed{filter:brightness(1.12)}
.pad,.pad button,.actions,#world{touch-action:none;overscroll-behavior:contain}
.pad button{transition:none;min-width:48px;min-height:44px;display:grid;place-items:center}
.mobile{user-select:none;-webkit-user-select:none;align-items:end}
.frame{touch-action:none;overscroll-behavior:contain}
input,textarea{user-select:text;-webkit-user-select:text;touch-action:manipulation}
@media(max-width:680px){.app{width:100%;max-width:100%;overflow:hidden}.hud{min-height:40px}.frame{width:100%}.mobile{padding-bottom:max(7px,env(safe-area-inset-bottom))}.actions button{min-width:100px}.pad{flex-shrink:0}}

/* Mobile analog-style movement control: no focus, selection, page drag, or gesture zoom. */
.joystick{width:150px;height:150px;max-width:38vw;max-height:38vw;aspect-ratio:1;position:relative;flex:none;align-self:center;border-radius:50%;border:3px solid #a4c5b4;background:radial-gradient(circle at 50% 45%,#3f766f,#213c43);box-shadow:inset 0 4px 14px #0a1d2288,0 4px 12px #081a1f88;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:contain}
.joystick-ring{position:absolute;inset:22%;border:2px solid #87af9e77;border-radius:50%;pointer-events:none}
.joystick-thumb{width:43%;height:43%;position:absolute;top:28.5%;left:28.5%;border:3px solid #e2d3a1;border-radius:50%;background:linear-gradient(140deg,#63958a,#365d60);box-shadow:0 4px 10px #071b2588;pointer-events:none;will-change:transform}
.joystick.active .joystick-thumb{background:linear-gradient(140deg,#83ae96,#447d73)}
.mobile{align-items:center}
@media(max-width:680px){.mobile{gap:10px;min-height:156px}.joystick{width:min(150px,38vw);height:auto}.actions{min-width:100px}.actions button{touch-action:manipulation}}

/* Fullscreen, fixed game viewport and overlay controls. */
html,body{margin:0;width:100%;height:100%;height:100dvh;max-height:100dvh;overflow:hidden!important;overscroll-behavior:none;touch-action:none}
body{display:block;position:fixed;inset:0}
.app{width:100%;height:100%;max-width:none;padding:0;overflow:hidden}
.screen{width:100%;height:100%}
#title.show,#selection.show{display:grid;place-items:center;padding:12px;overflow:hidden}
#title .panel,#selection .panel{max-width:min(680px,96vw);max-height:calc(100dvh - 24px);overflow:auto;overscroll-behavior:contain}
#game.show{display:block;position:fixed;inset:0;overflow:hidden;touch-action:none}
#game .frame{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:0;overflow:hidden;touch-action:none;background:#234d38}
#world{position:absolute;inset:0;display:block;width:100%;height:100%;aspect-ratio:auto;object-fit:fill;touch-action:none}
#game .hud{position:absolute;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0;pointer-events:none}
#game .hud>div{background:#152d32d9;border:1px solid #bda06d;padding:7px 10px;border-radius:10px;max-width:66vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(11px,2.6vw,15px)}
#game .hud button{pointer-events:auto;background:#294b49e8}
#game .mobile{display:flex;position:absolute;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:3;align-items:flex-end;justify-content:space-between;margin:0;padding:0;gap:12px;pointer-events:none;touch-action:none}
#game .joystick,#game .actions{pointer-events:auto}
#game .joystick{width:clamp(108px,29vw,150px);height:clamp(108px,29vw,150px);max-width:none;max-height:none;flex-shrink:0}
#game .actions{display:grid;gap:10px;min-width:105px}
#game .actions button{min-height:55px;background:#325d54e8;font-size:14px;padding:8px 12px}
#game .actions button.primary{background:#a45d48ee}
#game .dialog{position:absolute;z-index:4;bottom:calc(max(14px,env(safe-area-inset-bottom)) + clamp(108px,29vw,150px) + 10px);left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));min-height:70px;max-height:35dvh;overflow:auto;margin:0}
#shade{z-index:9;overflow:hidden}
#shade .modal{max-height:86dvh;overscroll-behavior:contain;touch-action:pan-y}
button,.joystick{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
@media(max-width:440px){#game .hud>div{max-width:69vw}#game .actions{min-width:95px}#game .actions button{min-height:50px}#game .dialog{font-size:14px}}
@media(max-height:500px){#game .joystick{width:100px;height:100px}#game .mobile{bottom:8px}#game .dialog{bottom:114px;max-height:28dvh}#game .actions button{min-height:44px}}
.build-label{display:inline-block;font-size:10px;vertical-align:middle;border:1px solid #bda06d91;padding:1px 4px;border-radius:4px;color:#fae5b3}
#game,#gameFrame,#world,#joystick,#game .mobile{touch-action:none!important;overscroll-behavior:none!important}
@media(max-width:680px){#game .hud>div{max-width:75vw}}

/* Phase 2: responsive team-turn battle presentation */
#shade:has(.combatTop) .modal{width:min(96vw,680px);padding:clamp(11px,2.4vw,20px)}
#shade:has(.combatTop) .modalHead h2{font-size:clamp(16px,3.4vw,22px)}
.combatTop{display:flex;justify-content:space-between;align-items:center;gap:6px;font:800 11px system-ui;letter-spacing:1.1px;color:#efd6ab;margin:3px 0 9px}
.combatTop span:last-child{color:#b3ddc8}
.combatRoster{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rosterTitle{font-size:10px;letter-spacing:.7px;font-weight:800;color:#c7d5c6;margin-bottom:5px}
.combatCard{background:linear-gradient(125deg,#2e4d48,#233a3c);border:1px solid #80968d;border-radius:9px;padding:7px 9px;margin-bottom:6px;min-height:59px;box-shadow:0 3px 9px #0003}
.combatCard.active{border-color:#e5c07d;box-shadow:0 0 0 1px #e5c07d60}
.combatCard.fainted{opacity:.45}
.combatCardHead{display:flex;justify-content:space-between;gap:3px;align-items:center;font-size:12px}
.combatCardHead small{font-size:10px;color:#c9d2c7;white-space:nowrap}
.combatCardFoot{font-size:10px;color:#e5e7d5;padding-top:4px;font-variant-numeric:tabular-nums}
.combatCard .health{height:9px;margin-top:5px;background:#15272c;border:1px solid #758780}
.combatCard .health div{background:#65cd92;transition:width 260ms ease-out}
.combatCard .health div.low{background:#edaa67}
.combatArena{position:relative;height:clamp(105px,19dvh,180px);display:grid;grid-template-columns:1fr 1fr;gap:10px;border:2px solid #9eaf91;border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#7fb4b5 0%,#acd2c1 48%,#80a574 50%,#597e55 100%);box-shadow:inset 0 10px 18px #ffffff22,inset 0 -12px 24px #133d2b44;margin:6px 0 9px}
.combatArena:before,.combatArena:after{content:"";position:absolute;bottom:5px;width:37%;height:21%;border-radius:50%;background:#31543c75;z-index:0}
.combatArena:before{left:7%}.combatArena:after{right:7%}
.combatSide{position:relative;z-index:1;display:flex;justify-content:space-around;align-items:center;gap:2px;padding:4px}
.combatFigure{position:relative;display:grid;place-items:center;align-content:center;min-width:0;flex:1;max-width:90px;height:94%;filter:drop-shadow(0 4px 2px #214b4b60)}
.combatSymbol{font-size:clamp(30px,7vw,61px);line-height:1.12;z-index:1;animation:combatHover 3s ease-in-out infinite}
.combatFigure small{font-size:10px;font-weight:800;color:#f6f0d8;background:#263f3bba;border-radius:5px;padding:2px 4px;text-shadow:0 1px #213d37}
.combatAura{position:absolute;left:19%;right:19%;top:16%;bottom:24%;border-radius:50%;border:2px solid #e1f1d24d}
.combatFigure.hit{animation:combatHit .36s ease-out}
.combatFigure.hit .combatAura{border-color:#f6e5a8;box-shadow:0 0 23px #f7dc7e}
.combatMessage{background:#203c3dcc;border-left:4px solid #c8ae79;border-radius:5px;padding:8px 10px;font-size:clamp(12px,2.6vw,14px);line-height:1.43;max-height:88px;overflow:auto;overscroll-behavior:contain}
.combatQueue{font-size:11px;color:#e2dfba;padding-top:6px}
.combatChoice{margin-top:9px;font-size:12px}
.combatChoice>b{color:#f9e1a9}
.combatActions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:7px}
.combatActions .btn{font-size:clamp(11px,2.4vw,13px);padding:9px 5px;min-height:39px;line-height:1.3;white-space:normal}
.combatActions .special{background:#516c8b}
.targetHint{font-size:11px;color:#bcd9c8;margin-top:3px}
.combatNote{font-size:10px!important;margin:9px 0 0}
.combatProcessing{padding:18px;text-align:center}
@keyframes combatHover{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes combatHit{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-2px)}}
@media(max-width:450px){.combatRoster{gap:5px}.combatCard{padding:5px}.combatCardHead{font-size:11px}.combatCardFoot{font-size:9px}#shade:has(.combatTop){padding:5px}.combatArena{height:110px}.combatSymbol{font-size:38px}}
@media(prefers-reduced-motion:reduce){.combatSymbol,.combatFigure.hit{animation:none}}

/* Phase 17: purely visual combat feedback; no timers or gameplay delays. */
.combatArena{isolation:isolate}
.battleVfx{--fx:#f3deb0;position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.battleVfx.vfx-fire{--fx:#ff904e}.battleVfx.vfx-water{--fx:#71d9f6}
.battleVfx.vfx-grass{--fx:#b7ef68}.battleVfx.vfx-electric{--fx:#ffe560}
.battleVfx.vfx-rock,.battleVfx.vfx-ground{--fx:#d1b58b}
.battleVfx.vfx-ice{--fx:#baf8ff}.battleVfx.vfx-flying{--fx:#d1f4ee}
.battleVfx.vfx-shadow,.battleVfx.vfx-ghost{--fx:#bf97fb}
.battleVfx.vfx-venom{--fx:#dc83ed}.battleVfx.vfx-psychic{--fx:#ffacd7}
.battleVfx.vfx-fighting{--fx:#ffae88}.battleVfx.vfx-steel{--fx:#d7edf2}
.battleVfx.vfx-dragon,.battleVfx.vfx-primordial,.battleVfx.vfx-beast{--fx:#fbca8e}
.battleVfxBeam{position:absolute;top:47%;left:29%;width:43%;height:5px;border-radius:100px;background:linear-gradient(90deg,transparent,var(--fx),white);box-shadow:0 0 16px 5px var(--fx);transform-origin:0 50%;animation:attackTrail .65s ease-out both}
.battleVfxCore{position:absolute;top:calc(47% - 10px);left:26%;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle,#fff 3%,var(--fx) 40%,transparent 76%);box-shadow:0 0 25px var(--fx);animation:attackCore .7s ease-out both}
.battleVfxBurst{position:absolute;left:27%;top:47%;height:48px;width:48px;border:3px solid var(--fx);border-radius:50%;box-shadow:0 0 20px var(--fx),inset 0 0 15px var(--fx);animation:attackBurst .7s ease-out both}
.battleVfxLabel{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);max-width:75%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:white;font-size:10px;font-weight:800;letter-spacing:.07em;text-shadow:0 1px 4px #142c35;background:#112f3888;padding:2px 8px;border-radius:20px}
.battleVfx.reverse .battleVfxBeam,.battleVfx.reverse .battleVfxCore,.battleVfx.reverse .battleVfxBurst{animation-direction:normal;transform:scaleX(-1)}
.battleVfx.reverse .battleVfxBeam{left:71%;transform-origin:0 50%;animation-name:attackTrailReverse}
.battleVfx.reverse .battleVfxCore{animation-name:attackCoreReverse}
.battleVfx.reverse .battleVfxBurst{animation-name:attackBurstReverse}
.battleVfx.missed .battleVfxBurst{opacity:.15}
@keyframes attackTrail{0%{transform:scaleX(0);opacity:0}20%{opacity:1}75%{transform:scaleX(1);opacity:.95}100%{transform:scaleX(1);opacity:0}}
@keyframes attackCore{0%{left:25%;opacity:0;transform:scale(.55)}30%{opacity:1}75%{left:69%;opacity:1}100%{left:72%;opacity:0;transform:scale(1.4)}}
@keyframes attackBurst{0%,55%{left:68%;transform:scale(.1);opacity:0}78%{opacity:1}100%{left:68%;transform:scale(1.7);opacity:0}}
@keyframes attackTrailReverse{0%{transform:scaleX(0);opacity:0}20%{opacity:1}75%{transform:scaleX(-1);opacity:1}100%{transform:scaleX(-1);opacity:0}}
@keyframes attackCoreReverse{0%{left:70%;opacity:0;transform:scale(.55)}30%{opacity:1}75%{left:25%;opacity:1}100%{left:23%;opacity:0;transform:scale(1.4)}}
@keyframes attackBurstReverse{0%,55%{left:24%;transform:scale(.1);opacity:0}78%{opacity:1}100%{left:24%;transform:scale(1.7);opacity:0}}
.captureCelebration{position:relative;min-height:83px;display:flex;align-items:center;justify-content:center;gap:12px;overflow:hidden;border:1px solid #8debc9;border-radius:12px;background:radial-gradient(circle at center,#347d7a,#102f42);color:#f7f5d7}
.captureWatch{font-size:30px;z-index:1;animation:capturePulse .9s ease-out both}
.captureBeam{height:5px;width:16%;border-radius:30px;background:#aaffee;box-shadow:0 0 20px #9affdf;animation:capturePulse .9s ease-out both}
.captureSpark{font-size:26px;color:#f5e5a2;animation:captureSpark 1s ease-out both}
.captureCelebration strong{font-size:11px;letter-spacing:.06em;z-index:1}
.evoNotices{position:relative;overflow:hidden}
.evoPulse{position:absolute;right:12px;top:3px;font-size:34px;color:#ffeaa4;animation:evolutionShimmer 1.4s ease-in-out both;pointer-events:none}
@keyframes capturePulse{0%{opacity:0;transform:scale(.4)}45%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}
@keyframes captureSpark{0%{opacity:0;transform:scale(.2) rotate(-60deg)}60%{opacity:1;transform:scale(1.5) rotate(25deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes evolutionShimmer{0%{opacity:0;transform:scale(.2) rotate(0)}60%{opacity:1;transform:scale(1.5) rotate(120deg)}100%{opacity:.8;transform:scale(1) rotate(180deg)}}
@media(prefers-reduced-motion:reduce){.battleVfxBeam,.battleVfxCore,.battleVfxBurst,.captureWatch,.captureBeam,.captureSpark,.evoPulse{animation:none!important}.battleVfxBeam,.battleVfxCore,.battleVfxBurst{display:none}}


/* Phase 4 — Critter Index wrist-device experience */
#shade:has(.watchShell){padding:clamp(5px,2vw,16px)}
#shade:has(.watchShell) .modal{width:min(95vw,680px);max-height:95dvh;overflow-y:auto;padding:clamp(10px,2.5vw,20px);background:linear-gradient(155deg,#142c34,#203c40);border:3px solid #bb9a65}
#shade:has(.watchShell) .modalHead h2{font-size:clamp(17px,4vw,24px);letter-spacing:.8px}
#shade:has(.watchShell) #close{padding:7px 11px;font-size:12px}
.watchShell{color:#f4efde;font-size:13px;min-width:0}
.watchStatus{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#9fdac7;font-size:10px;letter-spacing:1px;margin:7px 0}
.watchStatus strong{color:#f5dfb1;font-size:13px;letter-spacing:0}
.watchStats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:12px}
.watchStats span{background:#223f43;border:1px solid #668b84;border-radius:7px;text-align:center;padding:6px 2px;font-size:clamp(9px,2.2vw,12px);white-space:nowrap}
.watchTabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-bottom:12px}
.watchTab{border:1px solid #678780;background:#274c4e;color:#c8dbd4;border-radius:7px;min-width:0;padding:10px 2px;font:700 clamp(9px,2vw,12px) system-ui;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
.watchTab.selected{color:#1e3437;background:#f0d397;border-color:#f0d397}
.watchTab:focus-visible,.watchPosition:focus-visible{outline:2px solid #fff2c7;outline-offset:1px}
.watchScreen{border-radius:12px;background:linear-gradient(140deg,#182f35,#13292f);border:2px solid #567a74;padding:clamp(10px,2.5vw,16px);min-height:260px}
.watchClockLayout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.95fr);align-items:center;gap:12px}
.watchClock{position:relative;width:min(100%,355px);aspect-ratio:1;margin:auto;border-radius:50%;border:10px solid #a18c6a;outline:3px solid #415b58;background:radial-gradient(circle at 45% 36%,#416768,#173c45 60%,#0d2d36 100%);box-shadow:inset 0 0 0 3px #f0d8a77a,inset 0 0 22px #051c25,0 6px 14px #0008}
